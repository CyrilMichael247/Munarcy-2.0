f<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUNARCHY 2.0 — General Body Applications</title>
<style>
:root{--navy:#071a36;--blue:#0d2d59;--gold:#c9a227;--text:#172033;--muted:#667085;--line:#d9e0ea}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#06152d,#0d2d59);min-height:100vh;color:var(--text)}
.wrap{max-width:850px;margin:auto;padding:32px 18px 50px}.card{background:#fff;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.25);overflow:hidden}
.hero{background:linear-gradient(135deg,#06152d,#123b73);color:#fff;padding:38px 34px;text-align:center;border-bottom:3px solid var(--gold)}
.hero h1{margin:0;font-size:34px;letter-spacing:2px}.hero p{margin:10px 0 0;color:#dce7f7}
.form{padding:34px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.full{grid-column:1/-1}
label{display:block;font-weight:700;margin-bottom:8px;font-size:14px} .required{color:#b42318}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none;background:#fff}
input:focus,select:focus,textarea:focus{border-color:#285b99;box-shadow:0 0 0 3px rgba(40,91,153,.12)}
textarea{min-height:115px;resize:vertical}.hint{font-size:12px;color:var(--muted);margin-top:6px}
button{width:100%;margin-top:25px;padding:15px;border:0;border-radius:10px;background:#0b2b57;color:#fff;font-size:16px;font-weight:800;letter-spacing:.4px;cursor:pointer}
button:hover{background:#123d78}button:disabled{opacity:.65;cursor:not-allowed}
.status{margin-top:16px;text-align:center;font-weight:700}.success{color:#067647}.error{color:#b42318}
.footer{text-align:center;color:#dce7f7;font-size:12px;margin-top:18px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding:30px 20px}.form{padding:24px}.hero h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<header class="hero">
<h1>MUNARCHY 2.0</h1>
<p>General Body Recruitment — Applications</p>
</header>
<form class="form" id="applicationForm">
<div class="grid">
<div><label>Full Name <span class="required">*</span></label><input name="name" required autocomplete="name"></div>
<div><label>Email Address <span class="required">*</span></label><input type="email" name="email" required autocomplete="email"></div>
<div><label>Phone Number <span class="required">*</span></label><input type="tel" name="phone" required autocomplete="tel"></div>
<div><label>Preferred Department <span class="required">*</span></label>
<select name="department" required>
<option value="">Select a department</option>
<option>Brand Ambassadors</option><option>Delegate Affairs</option><option>Media & Graphics</option>
<option>Management & Hospitality</option><option>Registration</option><option>Security</option>
<option>Public Relations</option><option>Marketing</option><option>Logistics</option>
<option>Volunteers</option><option>Events</option><option>Corporate</option>
</select></div>
<div class="full"><label>MUN Experience</label><textarea name="experience" placeholder="Tell us briefly about your previous MUN experience, roles, conferences, or relevant experience."></textarea></div>
</div>
<button type="submit" id="submitBtn">SUBMIT APPLICATION</button>
<div id="status" class="status"></div>
</form>
</div>
<div class="footer">MUNARCHY 2.0 • General Body Recruitment</div>
</div>

</body>
</html>
