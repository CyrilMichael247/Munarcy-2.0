<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwoy0jdZcst6gVE4OUE31WIdk2QEsJ7eeYszD0gZFKa-heTwcK5za5hz0BGRjuhV2KN7g/exec";

const form = document.getElementById("applicationForm");
const btn = document.getElementById("submitBtn");
const status = document.getElementById("status");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    btn.disabled = true;
    btn.textContent = "SUBMITTING...";

    status.className = "status";
    status.textContent = "Submitting your application...";

    try {
        const data = Object.fromEntries(new FormData(form).entries());

        await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
        });

        status.className = "status success";
        status.textContent = "Application submitted successfully. Thank you!";

        form.reset();

    } catch (err) {
        console.error("Submission error:", err);

        status.className = "status error";
        status.textContent = "Unable to submit right now. Please try again.";
    }

    btn.disabled = false;
    btn.textContent = "SUBMIT APPLICATION";
});
</script>
</body>
</html>
